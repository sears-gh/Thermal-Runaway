name: Auto-create PR

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!gh-pages'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" \
            --json number \
            --jq 'length')

          if [ "$existing" != "0" ]; then
            echo "PR already exists for ${{ github.ref_name }}, skipping."
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" \
            --base main \
            --title "${{ github.ref_name }}" \
            --body "Branch \`${{ github.ref_name }}\` の自動PR" \
          && echo "PR created." \
          || echo "PR creation skipped (no diff or other reason)."
